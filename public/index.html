<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book API | Digital Library</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            padding: 25px 40px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.25);
        }

        .header-content {
            max-width: 1100px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .logo-section h1 {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .logo-section p {
            font-size: 13px;
            opacity: 0.85;
        }

        .api-status {
            background: rgba(255, 255, 255, 0.15);
            padding: 9px 15px;
            border-radius: 20px;
            font-size: 13px;
        }

        main {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h2 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #111827;
        }

        .welcome p {
            color: #6b7280;
            font-size: 15px;
        }

        .controls {
            background: white;
            padding: 18px;
            border-radius: 14px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.06);
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 220px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        .search-box input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .status-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            gap: 10px;
        }

        #status {
            color: #6b7280;
            font-size: 14px;
        }

        .book-count {
            background: #eef2ff;
            color: #4338ca;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        #list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            list-style: none;
        }

        .book-card {
            background: white;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.06);
            transition: 0.25s;
            border: 1px solid #eef0f4;
            position: relative;
            overflow: hidden;
        }

        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .book-icon {
            width: 48px;
            height: 48px;
            background: #eef2ff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .book-title {
            font-size: 18px;
            font-weight: bold;
            color: #111827;
            line-height: 1.4;
            margin-bottom: 8px;
        }

        .author {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .details {
            border-top: 1px solid #f0f1f3;
            padding-top: 14px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 9px;
            font-size: 13px;
        }

        .detail-label {
            color: #9ca3af;
        }

        .detail-value {
            color: #374151;
            font-weight: 500;
            text-align: right;
        }

        .badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .category {
            background: #eef2ff;
            color: #4338ca;
        }

        .available {
            background: #dcfce7;
            color: #15803d;
        }

        .borrowed {
            background: #fee2e2;
            color: #dc2626;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: #9ca3af;
        }

        .empty-icon {
            font-size: 45px;
            margin-bottom: 10px;
        }


        footer {
            text-align: center;
            padding: 30px 20px;
            color: #9ca3af;
            font-size: 13px;
        }


        @media (max-width: 900px) {

            #list {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 600px) {

            header {
                padding: 20px;
            }

            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .api-status {
                display: none;
            }

            main {
                margin-top: 25px;
            }

            .welcome h2 {
                font-size: 23px;
            }

            #list {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            .search-box {
                width: 100%;
            }

            button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- 
         HEADER
     -->

    <header>

        <div class="header-content">

            <div class="logo-section">

                <div class="logo">
                    📚
                </div>

                <div>

                    <h1>Digital Library</h1>

                    <p>Protected Book API</p>

                </div>

            </div>

            <div class="api-status">
                🔒 API Protected
            </div>

        </div>

    </header>


    <!-- 
         MAIN CONTENT
     -->

    <main>

        <div class="welcome">

            <h2>Book Collection</h2>

            <p>
                Browse the available books in our digital
                library collection.
            </p>

        </div>


        <!-- Controls -->

        <div class="controls">

            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="🔍 Search books, authors, or categories..."
                    onkeyup="searchBooks()"
                >

            </div>

            <button onclick="loadBooks()">
                🔄 Refresh Books
            </button>

        </div>


        <!-- Status -->

        <div class="status-box">

            <p id="status">
                Loading books...
            </p>

            <span
                class="book-count"
                id="bookCount"
            >
                0 Books
            </span>

        </div>


        <!-- Book List -->

        <ul id="list"></ul>

    </main>

    <footer>

        Digital Library &nbsp;•&nbsp;
        Book API &nbsp;•&nbsp;
        API Key Protected

    </footer>

    <script>

        let allBooks = [];

        async function loadBooks() {

            const status =
                document.getElementById("status");

            const list =
                document.getElementById("list");

            const bookCount =
                document.getElementById("bookCount");


            list.innerHTML = "";

            status.innerText =
                "Loading books...";


            try {

                const response = await fetch(
                    "/api/books",
                    {
                        method: "GET",

                        headers: {
                            "x-api-key":
                                "BOOK-API-2026-X7K9P4M2"
                        }
                    }
                );


                const result =
                    await response.json();


                // Check API response

                if (!response.ok) {

                    status.innerText =
                        "❌ " + result.message;

                    return;

                }


                // Store books

                allBooks = result.data;


                // Update count

                bookCount.innerText =
                    allBooks.length + " Books";


                status.innerText =
                    "✅ Books loaded successfully";


                displayBooks(allBooks);


            } catch (error) {

                console.error(error);


                status.innerText =
                    "❌ Unable to connect to the server.";

            }

        }

        function displayBooks(books) {

            const list =
                document.getElementById("list");


            list.innerHTML = "";


            if (books.length === 0) {

                list.innerHTML = `

                    <div class="empty">

                        <div class="empty-icon">
                            📚
                        </div>

                        <h3>
                            No books found
                        </h3>

                        <p>
                            Try searching for another book.
                        </p>

                    </div>

                `;

                return;

            }


            books.forEach(book => {

                const listItem =
                    document.createElement("li");


                listItem.className =
                    "book-card";


                let availabilityClass =
                    "available";


                if (
                    book.availability !== "Available"
                ) {

                    availabilityClass =
                        "borrowed";

                }


                listItem.innerHTML = `

                    <div class="book-icon">
                        📖
                    </div>


                    <div class="book-title">

                        ${book.title}

                    </div>


                    <div class="author">

                        ✍️ By ${book.author}

                    </div>


                    <div class="details">


                        <div class="detail-row">

                            <span class="detail-label">
                                Category
                            </span>

                            <span class="badge category">
                                ${book.category}
                            </span>

                        </div>


                        <div class="detail-row">

                            <span class="detail-label">
                                Published
                            </span>

                            <span class="detail-value">
                                ${book.yearPublished}
                            </span>

                        </div>


                        <div class="detail-row">

                            <span class="detail-label">
                                Status
                            </span>

                            <span
                                class="badge ${availabilityClass}"
                            >
                                ${book.availability}
                            </span>

                        </div>


                    </div>

                `;


                list.appendChild(listItem);

            });

        }

        function searchBooks() {

            const searchInput =
                document.getElementById("searchInput");


            const searchTerm =
                searchInput.value.toLowerCase();


            const filteredBooks =
                allBooks.filter(book =>

                    book.title
                        .toLowerCase()
                        .includes(searchTerm)

                    ||

                    book.author
                        .toLowerCase()
                        .includes(searchTerm)

                    ||

                    book.category
                        .toLowerCase()
                        .includes(searchTerm)

                );


            displayBooks(filteredBooks);


            document.getElementById("bookCount").innerText =
                filteredBooks.length + " Books";

        }

        loadBooks();

    </script>


</body>

</html>
